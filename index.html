<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كل سنة وأنتي طيبة يا هندا</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            border: 2px solid #fff;
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 {
            color: #d81b60;
            font-size: 2.8rem;
            line-height: 1.5;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .emoji-container {
            font-size: 3rem;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .bounce {
            animation: bounce 1.2s infinite ease-in-out alternate;
        }
        
        .bounce:nth-child(2) { animation-delay: 0.2s; }
        .bounce:nth-child(3) { animation-delay: 0.4s; }
        .bounce:nth-child(4) { animation-delay: 0.6s; }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>كل سنة وأنتي طيبة يا هندا 🎉🥳</h1>
        <div class="emoji-container">
            <span class="bounce">✨</span>
            <span class="bounce">🎈</span>
            <span class="bounce">🎂</span>
            <span class="bounce">❤️</span>
        </div>
    </div>

</body>
</html>
